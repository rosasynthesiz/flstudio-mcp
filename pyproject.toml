[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-studio-mcp"
version = "2.0.0.dev0"
description = "FL Studio MCP server: control FL Studio with Claude, Cursor and other AI assistants - AI mixing, mix diagnosis, plugin control, piano roll and patterns"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "rosasynthesiz" },
]
requires-python = ">=3.10"
keywords = ["mcp", "mcp-server", "model-context-protocol", "fl-studio", "flstudio", "fruity-loops", "fruityloops", "daw", "music-production", "mixing", "midi", "ai", "ai-music", "claude", "cursor", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Sound/Audio :: Mixers",
]
dependencies = [
    "fastmcp>=2.0.0,<5",      # tested with 4.2; a new major needs a check first
    "pydantic>=2.7.0",
    "mido>=1.3.2",
    "python-rtmidi>=1.5.8",
    # Piano-roll script trigger. Windows only: macOS sends the key through
    # System Events (osascript), so no GUI-automation package is installed there.
    "pyautogui>=0.9.54; sys_platform == 'win32'",
    "pygetwindow>=0.0.9; sys_platform == 'win32'",  # Windows focus helper
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
# Audio analysis (Integration 2/3). Needs ffmpeg on PATH for MP3 decoding.
audio = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.24",
    "scipy>=1.10",
]
# Higher-accuracy melody/pitch via CREPE (torchcrepe). HEAVY: pulls torch
# (~500MB on disk, slower on CPU). Install ALONGSIDE [audio], e.g.
#   pip install -e .[audio,audio-accurate]
# Without it, fl_extract_melody falls back to the lighter pyin engine.
audio-accurate = [
    "torch>=2.0",
    "torchcrepe>=0.0.23",
]
# Chords to MIDI (Basic Pitch on ONNX). Also run, since its TensorFlow pin has
# no Python 3.12 build:  pip install --no-deps basic-pitch==0.4.0
audio-chords = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.24",
    "scipy>=1.10",
    "onnxruntime>=1.16",
    "pretty-midi>=0.2.9",
    "mir-eval>=0.6",
    "resampy>=0.2.2,<0.4.3",
    "setuptools<81",          # resampy needs pkg_resources
    "scikit-learn",
    "typing-extensions",
]

[project.scripts]
fl-studio-mcp = "fl_studio_mcp.server:main"
fl-studio-mcp-daemon = "fl_studio_mcp.daemon:main"

[project.urls]
Homepage = "https://github.com/rosasynthesiz/flstudio-mcp"
Repository = "https://github.com/rosasynthesiz/flstudio-mcp"
Issues = "https://github.com/rosasynthesiz/flstudio-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_studio_mcp"]

# Ship the FL controller script inside the wheel so `fl-studio-mcp setup`
# works from PyPI / uvx with no git clone.
[tool.hatch.build.targets.wheel.force-include]
"fl_controller/FLStudioMCP/device_FLStudioMCP.py" = "fl_studio_mcp/_controller/device_FLStudioMCP.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v -rA --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
