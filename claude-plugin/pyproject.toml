[project]
name = "fl-studio-mcp-claude-plugin"
version = "2.0.0"
description = "Runtime environment for the FL Studio MCP Claude plugin"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastmcp==4.2.6",
    "pydantic==2.14.4",
    "mido==1.3.3",
    "python-rtmidi==1.5.8",
    # Transitive (fastmcp -> joserfc). Pinned only because the newest release
    # has no macOS Intel wheel and this plugin installs with --no-build.
    "cryptography==48.0.1",
]
